name: build-lla-crm-image
on:
  workflow_dispatch: {}
  push:
    branches: [lla-brand]
    paths-ignore:
      - 'lla/**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/phoanglong/lla-crm:lla-brand
            ghcr.io/phoanglong/lla-crm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
